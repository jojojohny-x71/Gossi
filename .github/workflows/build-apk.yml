name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk Gossi.apk

      - name: Check the offline engine is inside the APK
        run: |
          unzip -l Gossi.apk | grep -E "lib/arm64-v8a/libgossi_whisper.so"
          ls -la Gossi.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Gossi-apk
          path: Gossi.apk

      - name: Publish as downloadable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: Gossi — latest build
          prerelease: true
          files: Gossi.apk
          body: |
            Latest Gossi build from `${{ github.ref_name }}` (${{ github.sha }}).
            Open this page on your phone, tap **Gossi.apk**, and install it (allow "Install unknown apps" for your browser).
